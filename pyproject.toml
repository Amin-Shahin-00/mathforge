[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathforge"
version = "0.1.0"
description = "A self-improving mathematical discovery system: conjecture, verify, learn, repeat."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "sympy>=1.12",
  "mpmath>=1.3",
  "pyyaml>=6.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
# Multi-machine / cloud scaling
cluster = ["ray[default]>=2.9"]
# Neural self-play engine (needs an NVIDIA GPU for anything serious)
llm = [
  "torch>=2.2",
  "transformers>=4.44",
  "peft>=0.12",
  "accelerate>=0.33",
  "datasets>=2.20",
]
# Fast batched inference on GPU (Linux + CUDA)
vllm = ["vllm>=0.6"]
dev = ["pytest>=7"]
# GMP backend for mpmath: about 10% faster PSLQ in the constants engine
fast = ["gmpy2>=2.1"]

[project.scripts]
mathforge = "mathforge.cli:main"

[tool.setuptools.packages.find]
include = ["mathforge*"]

[tool.setuptools.package-data]
mathforge = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
