run:
  dir: runs/demo_final
  seed: 0
  max_rounds: 0
  checkpoint_every: 1
  report_every: 5
compute:
  backend: local
  workers: 0
  ray_address: auto
curriculum:
  target_success: 0.5
  band: 0.15
  step: 1
  min_level: 1
  max_level: 50
engines:
  constants:
    enabled: true
    tasks_per_round: 32
    candidates_per_task: 400
    targets:
    - pi
    - e
    - ln2
    - zeta3
    - catalan
    - sqrt2
    - phi
    - euler_gamma
    - zeta5
    - pi2
    depth: 300
    screen_digits: 18
    verify_depth: 2000
    verify_digits: 50
    max_relation_coeff: 200
    mitm_coeff: 6
    pslq_fraction: 0.1
    explore_fraction: 0.5
  laws:
    enabled: true
    tasks_per_round: 8
    population: 500
    generations: 60
    samples: 200
    noise: 0.0
    success_nmse: 1.0e-10
    max_library: 40
    datasets: []
  selfplay:
    enabled: false
    verifier: sympy
    policy:
      backend: hf
      model: Qwen/Qwen2.5-Math-1.5B-Instruct
      max_new_tokens: 512
      temperature: 0.8
      samples_per_problem: 8
      tensor_parallel: 1
      num_actors: 0
      gpu_memory_utilization: 0.85
      max_model_len: 4096
      batch_size: 8
    problems_per_round: 128
    proposer_fraction: 0.25
    train_every: 5
    min_new_traces: 64
    max_traces: 20000
    eval_every: 5
    eval_levels:
    - 1
    - 3
    - 5
    - 7
    - 9
    eval_per_level: 4
    trainer:
      lora_r: 32
      lora_alpha: 64
      lr: 0.0001
      epochs: 1
      batch_size: 8
      grad_accum: 4
      max_len: 1024
      keep_policy_loaded: false
    lean:
      project_dir: lean_workspace
      timeout_s: 120
      theorem_file: ''
      header: ''
